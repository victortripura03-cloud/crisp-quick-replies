<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crisp Quick Replies</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <img
            class="brand-icon"
            src="icons/icon-128.png"
            alt=""
            width="48"
            height="48"
          >
          <h1>Crisp Quick Replies</h1>
        </div>
        <p>Create a shortcut of at least 3 key presses. Sequences must be entered in Crisp within 3 seconds.</p>
      </header>

      <form id="shortcut-form">
        <input id="shortcut-id" type="hidden">
        <label for="sequence-display">Shortcut sequence</label>
        <div class="sequence-row">
          <output id="sequence-display" aria-live="polite">No keys recorded</output>
          <button id="capture-button" type="button">Record keys</button>
        </div>
        <p class="hint">Click Record keys, then press your shortcut in order. Press Space to record a final space; press Escape to stop.</p>

        <label for="response">Saved response</label>
        <textarea id="response" rows="5" required placeholder="Write the response to insert into the Crisp draft."></textarea>

        <div class="form-actions">
          <button id="save-button" type="submit">Save shortcut</button>
          <button id="cancel-button" type="button" hidden>Cancel edit</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <section aria-labelledby="saved-heading">
        <h2 id="saved-heading">Saved shortcuts</h2>
        <ul id="shortcut-list"></ul>
        <p id="empty-state">No shortcuts saved yet.</p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
